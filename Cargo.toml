[package]
name = "tidymedia"
version = "1.1.4"
edition = "2024"

[lib]
crate-type = ["rlib"]

# 业务关键 dep 使用 caret 主版本约束，规则见 src/CLAUDE.md「Rust 与依赖陷阱」。
[dependencies]
camino = { version = "1.2", features = ["serde1"] }
cfb = "0.7"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
dashmap = "6"
ignore = "0.4"
infer = "0.19"
nom-exif = "3.6"
parking_lot = "0.12"
percent-encoding = "2.3"
plist = "1.9"
rayon = "1.12"
regex = "1"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
smb2 = "0.20"
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
tract-onnx = "0.23"
image = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wyhash = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = "8"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
flate2 = "1.1.9"

[dev-dependencies]
assert_cmd = "2"
chrono = "0.4"
ctor = "1.0.13"
filetime = "0.2"
hex = "0.4"
image = "0.25"
predicates = "3"
pretty_assertions = "1"
rstest = "0.26"
tract-onnx = "0.23"
uuid = "1.24.0"

[lints.rust]
future_incompatible = { level = "warn", priority = -2 }
nonstandard_style = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "deny" }

[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "warn", priority = -1 }
redundant_clone = "deny"

[profile.release]
opt-level = 3

# 临时 patch：nom-exif 3.6.0 入口 MIME gate（file.rs parse_bmff_mime）只认 ftyp/wide
# 起头，不识别老 QuickTime MOV 的两种变体：pnot 起头（NIKON COOLPIX S5/P5000、Casio
# 等早期机型）与 mdat 起头（无任何头 atom、moov 在文件末尾），直接返 UnsupportedFormat。
# fork 在 parse_bmff_mime 入口按首 box header（仅 header——mdat body 远超 128B 解析
# buffer）短路返 QuickTime mime；mov.rs::extract_moov_body_from_buf 经 ClearAndSkip
# 跳过任意大小 mdat 后解析 moov。
# 上游 PR: https://github.com/mindeng/nom-exif/pulls （feat/legacy-quicktime-pnot）
# 合并发版后切回 crates.io。
[patch.crates-io]
nom-exif = { git = "https://github.com/enjoypi/nom-exif.git", branch = "feat/legacy-quicktime-pnot" }
